<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Formulário 1</title>
</head>

<body>

    <div class="container mt-4"> <!-- 1-->
        <h3>Formulário 1</h3>
        <hr>
        <div class="row mb-3"> <!-- 2-->
            <div class="col-md-4"> 
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex: Bruno" required="">
                </div>

                <div class="col-md-4">
                <label class="form-label">Sobrenome</label>
                <input type="text" class="form-control" id="sobrenome" name="sobrenome" placeholder="Ex: Venturin" required="">
                </div>

                <div class="col-md-4">
                <label class="form-label">Usuário</label>

                <div class="input-group">
                <span class="input-group-text">@</span>
                <input type="text" class="form-control" id="user" name="user" placeholder="Ex: venturin_bruno" required="">
                </div>
        </div><!-- 2-->

         <div class="row mb-3"><!-- 3 -->
                <div class="col-md-6">
                <label class="form-label">Cidade</label>
                <input type="text" class="form-control" id="cidade" name="cidade" placeholder="Ex: Parispozino" required="">
                </div>

                <div class="col-md-3">
                <label class="form-label">Estado</label>
                <input type="text" class="form-control" id="estado" name="estado" placeholder="Ex: São Paulo" required="">
                </div>

                <div class="col-md-3">
                <label class="form-label">CEP</label>
                <input type="text" class="form-control" id="CEP" name="CEP" placeholder="Ex: 19200000" required="">
                </div>
        </div><!-- 3 -->

        <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="termo" name="termo" required="">
                <label class="form-check-label">
                Aceito os termos e condições
                </label>
        </div>

        <button class="btn btn-primary">Enviar formulário</button>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    </div><!-- 1 -->    
<form>
</body>
</html>
